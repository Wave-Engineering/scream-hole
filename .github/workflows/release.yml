name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign (Fulcio/Rekor) via the shared oaw-sign-image action

env:
  # GHCR path hardcoded lowercase. The old form `ghcr.io/${{ github.repository }}`
  # interpolated to `ghcr.io/Wave-Engineering/scream-hole` (capital) — GHCR tolerates that,
  # but Docker Hub (the mirror target below) rejects a mixed-case repository path.
  IMAGE: ghcr.io/wave-engineering/scream-hole

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release_refs: ${{ steps.mirror.outputs.release-refs }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: Docker Hub login is deliberately AFTER the build (see flightdeck #20). The
      # oakandwave Org Access Token is scoped to oakandwave/* only; logging into Docker Hub
      # before the build makes buildx present it for ALL docker.io pulls, and it cannot pull
      # the oven/bun base (401 insufficient scopes) -> build fails. Building with no Docker
      # Hub creds keeps those public pulls anonymous (they work).

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # Force the OCI source/url labels lowercase (metadata-action's auto-source would
          # otherwise bake the org's capitalized "Wave-Engineering" URL).
          labels: |
            org.opencontainers.image.source=https://github.com/wave-engineering/scream-hole
            org.opencontainers.image.url=https://github.com/wave-engineering/scream-hole
          # `latest` is deliberately ABSENT here. Do not add it back.
          #
          # metadata-action defaults to `flavor: latest=auto` (src/flavor.ts
          # Transform), which publishes `latest` for a stable semver tag and
          # withholds it from a pre-release — see the action README's
          # "Latest tag" section.
          #
          # An explicit `type=raw,value=latest` does NOT override that
          # decision, it BYPASSES it. Under `auto`, procRaw hands `false`
          # to setVersion (src/meta.ts):
          #
          #   Meta.setVersion(version, vraw,
          #     this.flavor.latest == 'auto' ? false : ...)
          #
          # so a raw entry can never make `latest` true. What it does is
          # emit the literal string `latest` as a tag of its own, on every
          # v* ref — `v1.4.0-rc1` included. That is what
          # `docker run ...:latest` would then serve, and README.md's Quick
          # Start tells every reader to run exactly that.
          #
          # Stated precisely because the wrong mechanism mispredicts:
          # `type=raw,value=latest,enable=false` would NOT suppress
          # auto-latest (getVersion skips disabled entries and the flavor
          # is untouched), and reordering this list changes nothing —
          # entries are sorted by priority before evaluation, descending
          # (src/tag.ts). See docker/metadata-action#593, which exists to
          # document this exact distinction.
          #
          # Removing the line IS the fix (#33). The safe default was always
          # in effect; the explicit entry bypassed it.
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push (GHCR)
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the GHCR image (cosign keyless + SBOM)
        # Consumer of cc-workflow's reusable oaw-sign-image action (fleet signing). Signs the
        # immutable digest; the GHCR login above is active and id-token grants OIDC. Small
        # image -> SBOM to rekor (action default), no TSA.
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-sign-image@21f10ce601b9340b30fd6df0b4a2e4bd663fe249
        with:
          digest-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Log in to Docker Hub
        # AFTER the build (see the note above): the OAT is only ever presented to docker.io
        # for the oakandwave push it is scoped for. Serves both the mirror and Scout below.
        uses: docker/login-action@v3
        with:
          username: oakandwave
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror the GHCR digest to Docker Hub oakandwave
        # Shared oaw-mirror-image action (claudecode-workflow#1326): copies the exact digest
        # under every tag, but pushes a version tag (X.Y.Z) only when it is absent, and fails
        # with nothing pushed if one already names another digest. Rebuilds nothing.
        id: mirror
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-mirror-image@d82d57ba3553ea5f82d3267f7c1e98d944a07a3a
        with:
          source-digest-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          tags: ${{ steps.meta.outputs.tags }}
          dest-image: docker.io/oakandwave/scream-hole

      - name: Sign the Docker Hub image (cosign keyless + SBOM)
        # Same digest as GHCR (imagetools copies content-identical); cosign sigs are
        # registry+digest-bound so the mirror needs its own signature. Docker Hub login active.
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-sign-image@21f10ce601b9340b30fd6df0b4a2e4bd663fe249
        with:
          digest-ref: docker.io/oakandwave/scream-hole@${{ steps.build.outputs.digest }}

      - name: Docker Scout — CVE scan the pushed image
        # Scans the actual image layers for known CVEs. Non-blocking; continue-on-error covers
        # ALL failures (auth/infra), so a Scout error can't red a release whose dual-push
        # already succeeded (flightdeck #20 review).
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: cves
          image: docker.io/oakandwave/scream-hole:${{ steps.meta.outputs.version }}
          only-severities: critical,high
          write-comment: false

  # Write the image's digest-pinned refs into the GitHub release. Its own job, after the
  # mirror and both signatures, so a release-API failure can't stop a signature, and
  # contents: write sits on a job that runs no registry or signing tooling.
  release-notes:
    needs: docker
    runs-on: ubuntu-latest
    # Its own block replaces the workflow-level one: no packages or id-token here.
    permissions:
      contents: write
    steps:
      - name: Write the image digest into the release
        # Releases here are written after CI, so a missing one is created (generated notes);
        # an existing one gets the Images block appended, or replaced on a rerun.
        uses: wave-engineering/claudecode-workflow/.github/actions/oaw-release-images@d82d57ba3553ea5f82d3267f7c1e98d944a07a3a
        with:
          release-tag: ${{ github.ref_name }}
          release-refs: ${{ needs.docker.outputs.release_refs }}
          source-digest-ref: ${{ env.IMAGE }}@${{ needs.docker.outputs.digest }}
          create-if-missing: "true"
